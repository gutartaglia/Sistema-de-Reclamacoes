<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #f5f5f5;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            background: #1e1e1e;
            padding: 35px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .logo-login {
            display: block;
            height: 64px;
            width: auto;
            margin: 0 auto 20px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 6px;
            color: #ffffff;
            text-align: center;
        }

        .subtitulo {
            color: #8b93a1;
            text-align: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #dddddd;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
        }

        .campo-senha {
            position: relative;
        }

        .campo-senha input {
            padding-right: 34px;
        }

        .botao-olho {
            position: absolute;
            top: 50%;
            right: 3px;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background: transparent;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b93a1;
            cursor: pointer;
        }

        .botao-olho:hover {
            color: #dddddd;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        .erro {
            background: #3a1f1f;
            border: 1px solid #a33;
            color: #ff9d9d;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <img src="{{ url_for('static', filename='img/logo_santa_fe_transparente.png') }}" alt="Santa Fé" class="logo-login">
        <h2>Sistema de Reclamações</h2>
        <p class="subtitulo">Entre com sua conta para continuar</p>

        {% if erro %}
        <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    value="{{ usuario_preenchido or '' }}"
                    autofocus
                    required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="campo-senha">
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required>
                    <button type="button" class="botao-olho" onclick="alternarVisibilidadeSenha()" tabindex="-1" aria-label="Mostrar senha">
                        <svg id="icone-olho" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit">Entrar</button>

        </form>
    </div>

    <script>
        function alternarVisibilidadeSenha() {
            const campo = document.getElementById("senha");
            const icone = document.getElementById("icone-olho");
            const estaVisivel = campo.type === "text";

            campo.type = estaVisivel ? "password" : "text";

            icone.innerHTML = estaVisivel
                ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>'
                : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.9 18.9 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        }
    </script>

</body>
</html>
